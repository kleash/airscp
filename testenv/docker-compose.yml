# Porter's Docker test lab. Start it with testenv/up.sh, remove it with testenv/down.sh.
# The published ports listen on 127.0.0.1 only. "inner" has no way out: there the bastion and the proxy reach the
# target by its service name.
name: porter-lab

services:
  target:
    build:
      context: target
      additional_contexts:
        keys: .keys
    hostname: target
    init: true
    ports: ["127.0.0.1:42201:22"]
    networks: [edge, inner]
    # A second file system in sftponly's chroot: a move onto it can't be a rename.
    tmpfs: ["/srv/sftp/upload/other-disk:uid=1001,gid=1001,mode=0755"]

  minimal:
    build:
      context: alpine
      additional_contexts:
        keys: .keys
      args: {LAB_USER: dev, LAB_PASSWORD: porter-min}
    hostname: minimal
    init: true
    ports: ["127.0.0.1:42202:22"]
    networks: [edge]

  # Alpine where dev may be root through sudo without a password, with OpenSSH's sftp-server (Browse and transfer
  # as). Root's files are only in this container.
  sudo:
    build:
      context: alpine
      additional_contexts:
        keys: .keys
      args: {LAB_USER: dev, LAB_PASSWORD: porter-sudo, EXTRA_PACKAGES: sudo openssh-sftp-server, SUDO_NOPASSWD: "yes"}
    hostname: sudo
    init: true
    ports: ["127.0.0.1:42205:22"]
    networks: [edge]

  # Alpine whose user changes their own password in tests (Host ▸ Change Password…): its own container,
  # so no other test's password changes. A test sets it back.
  passwd:
    build:
      context: alpine
      additional_contexts:
        keys: .keys
      args: {LAB_USER: changer, LAB_PASSWORD: Lab-Pass-Alpha-7, EXTRA_PACKAGES: shadow}
    hostname: passwd
    init: true
    ports: ["127.0.0.1:42206:22"]
    networks: [edge]

  bastion:
    build:
      context: alpine
      additional_contexts:
        keys: .keys
      args: {LAB_USER: jump, LAB_PASSWORD: porter-jump}
    hostname: bastion
    init: true
    command: ["/usr/sbin/sshd", "-D", "-e", "-o", "AllowTcpForwarding=yes"]
    ports: ["127.0.0.1:42203:22"]
    networks: [edge, inner]

  # The lab key, then a verification code (two-factor: PAM with Google Authenticator's module).
  twofactor:
    build:
      context: twofactor
      additional_contexts:
        keys: .keys
    hostname: twofactor
    init: true
    ports: ["127.0.0.1:42204:22"]
    networks: [edge]

  proxy:
    build: proxy
    hostname: proxy
    init: true
    ports: ["127.0.0.1:42280:8888"]
    networks: [edge, inner]

  # The same proxy without a password: CONNECT with no Proxy-Authorization.
  openproxy:
    build: proxy
    hostname: openproxy
    init: true
    command: ["sh", "-c", "grep -v '^BasicAuth' /etc/tinyproxy/tinyproxy.conf >/tmp/open.conf && exec tinyproxy -d -c /tmp/open.conf"]
    ports: ["127.0.0.1:42281:8888"]
    networks: [edge, inner]

  # Squid that asks for Digest login only (no Basic): user porter, password porter-proxy.
  digestproxy:
    build: digestproxy
    hostname: digestproxy
    init: true
    ports: ["127.0.0.1:42282:8888"]
    networks: [edge, inner]

  # A SOCKS5 proxy (Dante): user porter, password porter-proxy.
  socksproxy:
    build: socksproxy
    hostname: socksproxy
    init: true
    ports: ["127.0.0.1:42283:1080"]
    networks: [edge, inner]

  # S3-compatible storage (Versity S3 Gateway, files on a tmpfs): access key porter-s3, secret key porter-s3-secret
  # (throwaway); the tests make their buckets.
  s3:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    hostname: s3
    init: true
    entrypoint: ["/usr/local/bin/versitygw", "--access", "porter-s3", "--secret", "porter-s3-secret", "posix", "/data"]
    tmpfs: ["/data"]
    ports: ["127.0.0.1:42284:7070"]
    networks: [edge]

  # Only on "inner", with no published port: reachable from the Mac only through the bastion or a proxy.
  private:
    build:
      context: alpine
      additional_contexts:
        keys: .keys
      args: {LAB_USER: dev, LAB_PASSWORD: porter-private}
    hostname: private
    init: true
    networks: [inner]

networks:
  edge: {}
  inner:
    internal: true
