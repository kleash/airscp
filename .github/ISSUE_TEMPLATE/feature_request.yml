name: Suggest a feature
description: Something AirSCP should do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do?
      description: The task, in your words. What do you do today instead?
      placeholder: I upload the same folder to three servers every day, and…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could AirSCP help?
      description: Optional. How you picture it working, or another app that does it well.
  - type: dropdown
    id: area
    attributes:
      label: Where in AirSCP?
      options:
        - Connecting (hosts, keys, passwords, jump hosts, proxies)
        - Files
        - Transfers
        - Synchronize or Find
        - Remote Desktop (Windows)
        - Monitor or Tunnels
        - Keys
        - AI agents (MCP)
        - Something else
